<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>angudelu</title>
	<link rel="icon" type="image/png" href="stallion.png">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main class="page">
		<h1>hola familia</h1>
		<div class="video-frame">
			<iframe class="video" width="560" height="315" src="https://www.youtube.com/embed/AeJTnaK0WiA?autoplay=1&mute=1&playsinline=1" title="YouTube video player" frameborder="0" allow="autoplay; accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
		</div>
		<div class="grid">
			<section class="section magenta"><h2><a href="historial-magenta.html">magenta</a></h2><div class="grid-text" data-text-file="texto-magenta.txt">Cargando texto...</div></section>
			<section class="section yellow"><h2><a href="historial-amarillo.html">amarillo</a></h2><div class="grid-text" data-text-file="texto-amarillo.txt">Cargando texto...</div></section>
			<section class="section cyan"><h2><a href="historial-cian.html">cian</a></h2><div class="grid-text" data-text-file="texto-cian.txt">Cargando texto...</div></section>
			<section class="section black"><h2><a href="historial-negro.html">negro</a></h2><div class="grid-text" data-text-file="texto-negro.txt">Cargando texto...</div></section>
		</div>
		<section class="comments-panel" aria-labelledby="comments-title">
			<h2 id="comments-title">Comentarios</h2>
			<form id="comment-form">
				<label for="comment-name">Usuario:contraseña</label>
				<div class="password-field">
					<input id="comment-name" name="name" type="password" maxlength="160" autocomplete="current-password" placeholder="usuario:contraseña" required>
					<button id="toggle-password" class="toggle-password" type="button" aria-controls="comment-name" aria-pressed="false">Mostrar</button>
				</div>
				<label for="comment-text">Comentario</label>
				<textarea id="comment-text" name="comment" maxlength="280" rows="4" required></textarea>
				<small class="comment-count" id="comment-count" aria-live="polite">0/280</small>
				<button type="submit">Publicar comentario</button>
				<p class="comment-status" id="comment-status" role="status" aria-live="polite"></p>
			</form>
			<div class="comment-list" id="comment-list" aria-live="polite">Cargando comentarios...</div>
			<iframe class="comment-transport" id="comment-transport" name="comment-transport" title="Envío de comentario" hidden></iframe>
		</section>
	</main>
	<script src="comments-config.js"></script>
	<script src="app.js?v=private-comments-2" defer></script>
</body>
</html>
